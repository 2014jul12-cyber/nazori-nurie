<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="なぞってぬりえ">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<title>なぞってぬりえ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 大きなタブ2つ(なぞる/ぬる) → 横にスクロールするえらぶ行 → 正方形のキャンバス → 色のパレット。指で触る前提で、ボタンはすべて48px以上。 */
:root {
  --bg: #e8f3ff;
  --fg: #1f2d4d;
  --panel: #ffffff;
  --line: #bcd3ee;
  --tab: #d3e6fb;
  --accent: #d9480f;
  --accent-fg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a30; --fg: #eaf1ff; --panel: #1b2a4a; --line: #35507f;
    --tab: #223660; --accent: #ff9a5c; --accent-fg: #2a1405;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a30; --fg: #eaf1ff; --panel: #1b2a4a; --line: #35507f;
  --tab: #223660; --accent: #ff9a5c; --accent-fg: #2a1405;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  font-weight: 500;
  padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 4px solid var(--accent); outline-offset: 3px; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--tab); padding: 6px; border-radius: 22px; }
.tab { min-height: 64px; border: 0; border-radius: 17px; background: transparent; font-weight: 900; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.tab svg { width: 30px; height: 30px; flex: none; }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.picker { display: grid; grid-auto-flow: column; grid-auto-columns: 62px; gap: 8px; overflow-x: auto; padding: 3px 3px 8px; margin: -3px -3px 0; scrollbar-width: thin; scroll-snap-type: x proximity; overscroll-behavior-x: contain; touch-action: pan-x; }
.pick { scroll-snap-align: start; aspect-ratio: 1; min-height: 48px; padding: 5px; border-radius: 16px; border: 3px solid var(--line); background: var(--panel); display: block; min-width: 0; }
.pick[aria-current="true"] { border-color: var(--accent); outline: 3px solid var(--accent); outline-offset: 0; }
.pick svg, .pick img { width: 100%; height: 100%; display: block; pointer-events: none; }
.pick img { object-fit: contain; border-radius: 8px; background: #fff; }
.pick.add { border-style: dashed; color: var(--accent); display: grid; place-items: center; }
.pick.add svg { width: 60%; height: 60%; }

.stagewrap { width: min(100%, max(260px, 54vh)); width: min(100%, max(260px, 54dvh)); margin: 0 auto; }
.stage { position: relative; aspect-ratio: 1; border-radius: 24px; overflow: hidden; border: 4px solid var(--line); background: #fff; touch-action: none; }
.stage svg.main { display: block; width: 100%; height: 100%; touch-action: none; }
.cwrap { position: relative; width: 100%; aspect-ratio: 1; }
.cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.pic .f { fill: #fff; stroke: #2b2a3a; stroke-width: 5; stroke-linejoin: round; transition: fill .12s; }
.pic .bg { stroke: none; }
.pic .o { fill: none; stroke: #2b2a3a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.pic .p { fill: #2b2a3a; pointer-events: none; }

.guide { fill: none; stroke: #d3e1f3; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; }
.dots { fill: none; stroke: #7f9cc8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 11; }
.stroke { fill: none; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }

.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 420px; margin: 4px auto 0; }
.sw, .clear { aspect-ratio: 1; min-height: 48px; border-radius: 50%; min-width: 0; }
.sw { background: var(--c); border: 3px solid rgba(0, 0, 0, .28); }
.sw[aria-pressed="true"] { outline: 5px solid var(--fg); outline-offset: 3px; transform: scale(1.04); }
.clear { background: var(--panel); border: 3px solid var(--line); font-weight: 900; font-size: 15px; line-height: 1.15; padding: 0; display: grid; place-items: center; }
.clear[data-armed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 420px); margin: 0 auto; }
.navbtn { min-height: 56px; border-radius: 18px; border: 3px solid var(--line); background: var(--panel); font-weight: 900; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; }
.navbtn svg { width: 26px; height: 26px; flex: none; }
.navbtn[aria-pressed="true"] { background: var(--tab); border-color: var(--accent); }
.navbtn.go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 420px; margin: 0 auto; }
.tool { min-height: 56px; border-radius: 16px; border: 3px solid var(--line); background: var(--panel); font-weight: 900; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; }
.tool svg { width: 26px; height: 26px; flex: none; }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.hist { width: min(100%, 420px); margin: 0 auto; display: grid; gap: 6px; }
.ht { font-weight: 900; font-size: 16px; }
.hrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hslot { display: grid; gap: 4px; justify-items: center; min-width: 0; padding: 6px; border-radius: 16px; border: 3px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 700; min-height: 48px; }
.hslot .th { width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #fff; display: grid; place-items: center; }
.hslot svg, .hslot img { width: 100%; height: 100%; display: block; pointer-events: none; }
.hslot.empty { border-style: dashed; opacity: .6; }
.hslot.empty .th { background: transparent; font-size: 14px; }
.vbody { width: min(64%, 280px); aspect-ratio: 1; border: 3px solid #bcd3ee; border-radius: 16px; overflow: hidden; background: #fff; }
.vbody svg, .vbody img { width: 100%; height: 100%; display: block; }

.padbar { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; width: 100%; max-width: 420px; margin: 4px auto 0; }
.padbar button { min-height: 60px; border-radius: 18px; font-size: 20px; font-weight: 900; border: 3px solid var(--line); background: var(--panel); }
.padbar .go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-size: 24px; }
.adult { display: flex; justify-content: center; }
.link { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 2px dashed var(--line); background: transparent; font-size: 15px; font-weight: 700; }
.link[data-armed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.cheer { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; background: rgba(255, 255, 255, .94); color: #1f2d4d; overflow: auto; }
.cheer h2 { margin: 0; font-size: 32px; font-weight: 900; }
.cheer .msg { margin: 0; padding: 0 24px; text-align: center; font-size: 17px; font-weight: 700; line-height: 1.5; }
.cheer .star { width: 108px; height: 108px; animation: pop .5s ease-out; }
.cheer .big { min-height: 64px; min-width: 190px; padding: 0 30px; border: 0; border-radius: 20px; background: #d9480f; color: #fff; font-size: 26px; font-weight: 900; display: grid; place-items: center; cursor: pointer; }
.cheer .sub { min-height: 52px; padding: 0 22px; border: 3px solid #bcd3ee; border-radius: 16px; background: transparent; color: #1f2d4d; font-size: 20px; font-weight: 700; }
.cheer i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall 1.7s var(--d) ease-in forwards; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes fall { to { transform: translateY(460px) rotate(420deg); opacity: .2; } }
@media (prefers-reduced-motion: reduce) {
  .cheer i { display: none; }
  .cheer .star { animation: none; }
  .pic .f { transition: none; }
}
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
@media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { color-scheme: dark; } }
</style>

</head>
<body>
<div class="app">
  <div class="tabs" role="group" aria-label="あそびかた">
    <button class="tab" id="tabTrace" aria-pressed="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M4 22 C10 4 17 30 28 10" stroke-dasharray="0.1 7"/></svg>なぞる
    </button>
    <button class="tab" id="tabColor" aria-pressed="false">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 C22 11 26 15 26 20 A10 10 0 0 1 6 20 C6 15 10 11 16 3Z" fill="currentColor"/></svg>ぬる
    </button>
  </div>

  <div class="picker" id="picker"></div>

  <div class="stagewrap">
    <div class="stage" id="stage">
      <div id="host"></div>
      <div class="cheer" id="cheer" hidden>
        <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38" fill="#ffcf33" stroke="#2b2a3a" stroke-width="4" stroke-linejoin="round"/></svg>
        <h2>できたね！</h2>
        <button class="big" id="nextBtn">つぎへ</button>
        <button class="sub" id="againBtn">もういちど</button>
      </div>
      <div class="cheer" id="viewer" hidden>
        <h2 id="vTitle"></h2>
        <div class="vbody" id="vBody"></div>
        <button class="sub" id="vClose">とじる</button>
      </div>
      <div class="cheer" id="chooser" hidden>
        <h2>じぶんの え</h2>
        <p class="msg" id="chMsg">かみに かいた えを しゃしんに とるか、ここで かきます。くろい ペンの えが おすすめ。</p>
        <label class="big" for="fileIn">しゃしん</label>
        <input type="file" id="fileIn" accept="image/*" class="vh">
        <button class="big" id="drawBtn">かく</button>
        <button class="sub" id="chCancel">やめる</button>
      </div>
    </div>
  </div>

  <div class="nav" id="nav">
    <button class="navbtn" id="orderBtn" aria-pressed="false" aria-label="えらびかた: じゅんばん">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="orderIcon"><path d="M5 9h22M5 16h22M5 23h22"/></svg><span id="orderTxt">じゅんばん</span>
    </button>
    <button class="navbtn go" id="skipBtn">つぎへ<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16h16M17 8l8 8-8 8"/></svg></button>
  </div>
  <div class="hist" id="hist" hidden></div>
  <div class="tools" id="tools" role="group" aria-label="ぬりかた" hidden>
    <button class="tool" data-tool="fill" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 C22 11 26 15 26 20 A10 10 0 0 1 6 20 C6 15 10 11 16 3Z" fill="currentColor"/></svg>ぺたっ</button>
    <button class="tool" data-tool="fat" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22 C11 8 20 28 27 10" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/></svg>ふとい</button>
    <button class="tool" data-tool="thin" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22 C11 8 20 28 27 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>ほそい</button>
  </div>
  <div class="palette" id="palette"></div>
  <div class="padbar" id="padbar" hidden>
    <button id="padBack">もどる</button>
    <button class="go" id="padDone">できた</button>
    <button id="padClear">けす</button>
  </div>
  <div class="adult" id="adult" hidden><button class="link" id="delBtn">この えを けす(おとなの かた)</button></div>
</div>

(function () {
  var SZ = 480;

  /*PURE_START*/
  function computeInk(d, S, direct) {
    var N = S * S, l = new Float32Array(N), i, x, y;

    }

    for (y = 0; y < S; y++) {
      var row = 0;

    }
    var R = 24;
    for (y = 0; y < S; y++) {

        ink[y * S + x] = a <= 0 ? 0 : a >= 1 ? 255 : Math.round(a * 255);

    }
    return ink;

  function dilate(src, S, r) {
    var N = S * S, tmp = new Uint8Array(N), out = new Uint8Array(N), x, y, k;
    for (y = 0; y < S; y++) for (x = 0; x < S; x++) {

      var a = Math.max(0, x - r), b = Math.min(S - 1, x + r);

  function makeBrushPath(b) {

  /* ---------- えらぶ行 ---------- */
  function itemsFor(m) {

  function currentItem() {

    for (i = 0; i < list.length; i++) if (list[i].key === sel[mode]) return list[i];
    for (i = 0; i < list.length; i++) if (list[i].kind === "shape" || list[i].kind === "pic") return list[i];

  function picSvg(pic, cls) {

  function renderPicker(reveal) {

  /* ---------- なぞる(ぶんぶんの かたち) ---------- */
  function renderTrace(it) {
    var sh = it.s;
    host.innerHTML =
      '<svg class="main pic" id="board" viewBox="0 0 300 300" role="img" aria-label="' + sh.name + 'をなぞる">' +
      '<rect width="300" height="300" fill="#fff"/>' +
      '<path id="guide" class="guide" d="' + sh.d + '"/>' +
      '<g id="done"></g>' +
      '<path class="dots" d="' + sh.d + '"/>' +
      '<g id="start"><circle r="17" fill="#3fae6a" stroke="#2b2a3a" stroke-width="4"/><polygon points="-5,-8 9,0 -5,8" fill="#fff"/></g>' +
      '<g id="strokes"></g><g class="deco">' + (sh.deco || "") + '</g>' +
      '<circle id="hint" r="10" fill="#ffcf33" stroke="#2b2a3a" stroke-width="4"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#guide"/></animateMotion></circle>' +
      "</svg>";
    var board = $("#board"), guide = $("#guide"), strokes = $("#strokes"), hint = $("#hint"), doneG = $("#done");
    var closed = /[zZ]\s*$/.test(sh.d.trim());
    var L = guide.getTotalLength(), n = Math.ceil(L / 5);
    var pts = [], i;
    for (i = 0; i <= n; i++) { var q = guide.getPointAtLength(L * i / n); pts.push([q.x, q.y]); }
    /* Zが無くても、はじめと おわりが かさなる線は ぐるっと一周する線として あつかう */
    if (Math.hypot(pts[0][0] - pts[n][0], pts[0][1] - pts[n][1]) < 3) closed = true;
    if (closed) pts.pop();
    var N = pts.length, W = 16, R2 = 22 * 22;
    var s0 = pts[0];
    $("#start").setAttribute("transform", "translate(" + s0[0] + " " + s0[1] + ")");
    if (reduce) hint.remove();
    var st = { cov: new Uint8Array(N), count: 0, done: false, cur: null, d: "", last: null, anchor: -1, prev: -1, list: [] };
    traceState = st;
    st.reset = function () {
      strokes.innerHTML = ""; doneG.innerHTML = ""; st.list = [];
      st.cov = new Uint8Array(N); st.count = 0; st.done = false; st.cur = null; st.anchor = -1; st.prev = -1;
      cheer.hidden = true;
      if (!reduce && !hint.isConnected) board.appendChild(hint);
      hint.style.display = "";
    };
    function pos(e) {
      var r = board.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * 300, (e.clientY - r.top) / r.height * 300];
    }
    function visit(k) {
      if (st.cov[k]) return;
      st.cov[k] = 1; st.count++;
      var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", pts[k][0].toFixed(1)); c.setAttribute("cy", pts[k][1].toFixed(1)); c.setAttribute("r", "15");
      c.setAttribute("fill", "#8fdca6");
      doneG.appendChild(c);
    }
    function nearest(p) {
      var bi = -1, bd = R2, k, idx, base = st.anchor >= 0 ? st.anchor : st.prev, span = st.anchor >= 0 ? W : 24;
      if (base >= 0) {
        for (k = -span; k <= span; k++) {
          idx = base + k;
          if (closed) idx = (idx + N) % N; else if (idx < 0 || idx >= N) continue;
          var dx = pts[idx][0] - p[0], dy = pts[idx][1] - p[1], dd = dx * dx + dy * dy;
          if (dd < bd) { bd = dd; bi = idx; }
        }
        if (bi >= 0 || st.anchor >= 0) return bi;
      }
      for (idx = 0; idx < N; idx++) {
        var ex = pts[idx][0] - p[0], ey = pts[idx][1] - p[1], ed = ex * ex + ey * ey;
        if (ed < bd) { bd = ed; bi = idx; }
      }
      return bi;
    }
    function mark(p) {
      var bi = nearest(p);
      if (bi >= 0) {
        var from = st.anchor >= 0 ? st.anchor : (st.prev >= 0 ? st.prev : -1);
        var d = from >= 0 ? bi - from : 0;
        if (closed) { if (d > N / 2) d -= N; else if (d < -N / 2) d += N; }
        /* 指を離して置きなおしても、ちかければ 間もつなげる */
        if (from < 0 || (st.anchor < 0 && Math.abs(d) > 10)) visit(bi);
        else {
          var s = d >= 0 ? 1 : -1, m = Math.abs(d), k;
          for (k = 0; k <= m; k++) visit(closed ? ((from + s * k) % N + N) % N : from + s * k);
        }
        /* 終わりのある線は、はしの ちかくまで なぞれたら はしまで とどいたことにする */
        if (!closed) {
          var e;
          if (bi <= 6) for (e = 0; e <= bi; e++) visit(e);
          if (bi >= N - 7) for (e = bi; e < N; e++) visit(e);
        }
        st.anchor = bi; st.prev = bi;
      }
      if (!st.done && st.count >= N - 2) { st.done = true; recordShape(it, st.list); setTimeout(showCheer, 450); }
    }
    function seg(a, b) {
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy), k = Math.max(1, Math.ceil(len / 5)), j;
      for (j = 1; j <= k; j++) mark([a[0] + dx * j / k, a[1] + dy * j / k]);
    }
    board.addEventListener("pointerdown", function (e) {
      if (st.done) return;
      e.preventDefault();
      board.setPointerCapture(e.pointerId);
      hint.style.display = "none";
      var p = pos(e);
      st.anchor = -1;
      st.cur = document.createElementNS("http://www.w3.org/2000/svg", "path");
      st.cur.setAttribute("class", "stroke");
      st.cur.style.stroke = penColor();
      st.d = "M" + p[0].toFixed(1) + " " + p[1].toFixed(1) + " l0.01 0";
      st.cur.setAttribute("d", st.d);
      strokes.appendChild(st.cur);
      st.last = p;
      st.list.push({ c: penColor(), pts: [p] });
      mark(p);
    });
    board.addEventListener("pointermove", function (e) {
      if (!st.cur || st.done) return;
      var p = pos(e);
      st.list[st.list.length - 1].pts.push(p);
      st.d += " L" + p[0].toFixed(1) + " " + p[1].toFixed(1);
      st.cur.setAttribute("d", st.d);
      seg(st.last, p);
      st.last = p;
    });
    function up() { st.cur = null; }
    board.addEventListener("pointerup", up);
    board.addEventListener("pointercancel", up);
  }

  /* ---------- ぬる(ぶんぶんの え) ---------- */
  function renderColor(pic) {
    var s = picSvg(pic, "main");
    s.setAttribute("role", "img");
    s.setAttribute("aria-label", pic.name + "のぬりえ");
    host.innerHTML = "";
    host.appendChild(s);
    function fillAt(e) {
      var el = document.elementFromPoint(e.clientX, e.clientY);
      if (!el || !el.classList || !el.classList.contains("f") || !s.contains(el)) return;
      var i = el.getAttribute("data-i");
      if (fills[pic.id][i] === color) return;
      fills[pic.id][i] = color;
      el.style.fill = color;
    }
    var bgrp = s.querySelector("g.brush"), curB = null, curEl = null;
    function sp(e) {
      var r = s.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * 300, (e.clientY - r.top) / r.height * 300];
    }
    s.addEventListener("pointerdown", function (e) {
      e.preventDefault(); painting = true;
      if (tool === "fill") { fillAt(e); return; }
      s.setPointerCapture(e.pointerId);
      var p = sp(e);
      curB = { d: "M" + p[0].toFixed(1) + " " + p[1].toFixed(1) + " l0.01 0", c: color, w: tool === "fat" ? 28 : 12 };
      brushes[pic.id].push(curB);
      curEl = makeBrushPath(curB);
      bgrp.appendChild(curEl);
    });
    s.addEventListener("pointermove", function (e) {
      if (!painting) return;
      if (tool === "fill") { fillAt(e); return; }
      if (!curB) return;
      var p = sp(e);
      curB.d += " L" + p[0].toFixed(1) + " " + p[1].toFixed(1);
      curEl.setAttribute("d", curB.d);
    });
    function end() { if (painting) { painting = false; curB = null; curEl = null; renderPicker(false); } }
    s.addEventListener("pointerup", end);
    s.addEventListener("pointercancel", end);
    s.addEventListener("pointerleave", end);
  }

  /* ---------- じぶんの え ---------- */
  function canvasHTML(ids) {
    return '<div class="cwrap">' + ids.map(function (id) {
      return '<canvas class="cv" id="' + id + '" width="' + SZ + '" height="' + SZ + '"></canvas>';
    }).join("") + "</div>";
  }

  function tracePts(c) {
    if (c.pts) return c.pts;
    var step = 9, out = [];
    for (var pass = 0; pass < 2; pass++) {
      out = [];
      for (var y = 4; y < SZ; y += step) for (var x = 4; x < SZ; x += step) if (c.mask[y * SZ + x]) out.push(x, y);
      if (out.length >= 60) break;
      step = 4;
    }
    c.pts = out;
    return out;
  }

  function renderCustomTrace(c) {
    host.innerHTML = canvasHTML(["cvBase", "cvDone", "cvPen"]);
    var base = $("#cvBase"), dn = $("#cvDone"), pen = $("#cvPen");
    base.style.pointerEvents = "none"; dn.style.pointerEvents = "none";
    if (!c.band) c.band = dilate(c.mask, SZ, 6);
    var bg = base.getContext("2d"), img = bg.createImageData(SZ, SZ), d = img.data, i;
    for (i = 0; i < SZ * SZ; i++) {
      var o = i * 4;
      if (c.mask[i]) { d[o] = 143; d[o + 1] = 169; d[o + 2] = 209; }
      else if (c.band[i]) { d[o] = 214; d[o + 1] = 227; d[o + 2] = 244; }
      else { d[o] = 255; d[o + 1] = 255; d[o + 2] = 255; }
      d[o + 3] = 255;
    }
    bg.putImageData(img, 0, 0);
    var dg = dn.getContext("2d"), pg = pen.getContext("2d");
    pg.lineCap = "round"; pg.lineJoin = "round"; pg.lineWidth = 24;
    dg.fillStyle = "#8fdca6";
    var pts = tracePts(c), M = pts.length / 2, R2 = 20 * 20;
    var st = { cov: new Uint8Array(M), count: 0, done: false, last: null, down: false };
    traceState = st;
    st.reset = function () {
      pg.clearRect(0, 0, SZ, SZ); dg.clearRect(0, 0, SZ, SZ);
      st.cov = new Uint8Array(M); st.count = 0; st.done = false; st.last = null; st.down = false;
      cheer.hidden = true;
    };
    function mark(p) {
      for (var k = 0; k < M; k++) {
        if (st.cov[k]) continue;
        var dx = pts[k * 2] - p[0], dy = pts[k * 2 + 1] - p[1];
        if (dx * dx + dy * dy < R2) {
          st.cov[k] = 1; st.count++;
          dg.beginPath(); dg.arc(pts[k * 2], pts[k * 2 + 1], 11, 0, 6.2832); dg.fill();
        }
      }
      if (!st.done && st.count >= M * 0.96) { st.done = true; recordCustom(c, [base, dn, pen]); setTimeout(showCheer, 450); }
    }
    function seg(a, b) {
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy), k = Math.max(1, Math.ceil(len / 6)), j;
      for (j = 1; j <= k; j++) mark([a[0] + dx * j / k, a[1] + dy * j / k]);
    }
    pen.addEventListener("pointerdown", function (e) {
      if (st.done) return;
      e.preventDefault(); pen.setPointerCapture(e.pointerId);
      var p = cpos(pen, e);
      st.down = true; st.last = p;
      pg.strokeStyle = penColor();
      pg.beginPath(); pg.moveTo(p[0], p[1]); pg.lineTo(p[0] + 0.01, p[1]); pg.stroke();
      mark(p);
    });
    pen.addEventListener("pointermove", function (e) {
      if (!st.down || st.done) return;
      var p = cpos(pen, e);
      pg.beginPath(); pg.moveTo(st.last[0], st.last[1]); pg.lineTo(p[0], p[1]); pg.stroke();
      seg(st.last, p);
      st.last = p;
    });
    function up() { st.down = false; }
    pen.addEventListener("pointerup", up);
    pen.addEventListener("pointercancel", up);
  }

  function paintColor(c, d) {
    for (var i = 0, N = SZ * SZ; i < N; i++) {
      var col = c.color[i], a = c.ink[i] / 255, o = i * 4, b = 1 - a;
      d[o] = ((col >> 16) & 255) * b + 43 * a;
      d[o + 1] = ((col >> 8) & 255) * b + 42 * a;
      d[o + 2] = (col & 255) * b + 58 * a;
      d[o + 3] = 255;
    }
  }

  function renderCustomColor(c) {
    host.innerHTML = canvasHTML(["cvColor"]);
    var cv = $("#cvColor"), g = cv.getContext("2d"), img = g.createImageData(SZ, SZ), down = false;
    paintColor(c, img.data); g.putImageData(img, 0, 0);
    function fillAt(e) {
      var p = cpos(cv, e), x = Math.floor(p[0]), y = Math.floor(p[1]);
      if (x < 0 || y < 0 || x >= SZ || y >= SZ) return;
      if (floodFill(c, SZ, x, y, packColor(color))) {
        c.dirty = true; paintColor(c, img.data); g.putImageData(img, 0, 0);
      }
    }
    var lastP = null;
    function disc(x, y, r) {
      var rgb = packColor(color), r2 = r * r;
      var y0 = Math.max(0, Math.floor(y - r)), y1 = Math.min(SZ - 1, Math.ceil(y + r));
      var x0 = Math.max(0, Math.floor(x - r)), x1 = Math.min(SZ - 1, Math.ceil(x + r));
      for (var yy = y0; yy <= y1; yy++) for (var xx = x0; xx <= x1; xx++) {
        var dx = xx - x, dy = yy - y;
        if (dx * dx + dy * dy <= r2) c.color[yy * SZ + xx] = rgb;
      }
    }
    function brushTo(p) {
      var r = tool === "fat" ? 22 : 9, a = lastP || p, dx = p[0] - a[0], dy = p[1] - a[1];
      var k = Math.max(1, Math.ceil(Math.sqrt(dx * dx + dy * dy) / (r / 2)));
      for (var j = 1; j <= k; j++) disc(a[0] + dx * j / k, a[1] + dy * j / k, r);
      lastP = p; c.dirty = true;
      paintColor(c, img.data); g.putImageData(img, 0, 0);
    }
    cv.addEventListener("pointerdown", function (e) {
      e.preventDefault(); cv.setPointerCapture(e.pointerId); down = true;
      if (tool === "fill") fillAt(e); else { lastP = null; brushTo(cpos(cv, e)); }
    });
    cv.addEventListener("pointermove", function (e) {
      if (!down) return;
      if (tool === "fill") fillAt(e); else brushTo(cpos(cv, e));
    });
    function end() { down = false; lastP = null; }
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
  }

  /* 写真や絵 → 線画データ */
  function makeCustom(src, w, h, id, direct) {
    var cv = document.createElement("canvas");
    cv.width = cv.height = SZ;
    var g = cv.getContext("2d", { willReadFrequently: true });
    g.fillStyle = "#fff"; g.fillRect(0, 0, SZ, SZ);
    var s = Math.min(SZ / w, SZ / h), dw = w * s, dh = h * s;
    g.drawImage(src, (SZ - dw) / 2, (SZ - dh) / 2, dw, dh);
    var im = g.getImageData(0, 0, SZ, SZ);
    var c = prepare(computeInk(im.data, SZ, direct), SZ);
    if (c.count < 150) return null;
    var out = g.createImageData(SZ, SZ), d = out.data;
    for (var i = 0; i < SZ * SZ; i++) { var v = 255 - c.ink[i]; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
    g.putImageData(out, 0, 0);
    c.url = cv.toDataURL("image/png");
    c.id = id || String(Date.now());
    return c;
  }
  function saveCustoms() {
    try {
      var arr = customs.map(function (c) { return { id: c.id, url: c.url }; });
      localStorage.setItem(STORE_KEY, JSON.stringify(arr));
    } catch (err) { /* 保存できなくても あそべます */ }
  }
  function loadCustoms() {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch (err) { arr = []; }
    if (!arr.length) return;
    var res = new Array(arr.length), left = arr.length;
    function one() {
      if (--left > 0) return;
      customs = res.filter(Boolean);
      render();
    }
    arr.forEach(function (o, i) {
      var im = new Image();
      im.onload = function () { res[i] = makeCustom(im, im.naturalWidth, im.naturalHeight, o.id, true); one(); };
      im.onerror = one;
      im.src = o.url;
    });
  }
  function addCustom(c) {
    if (!c) { showChooser("せんが みつかりませんでした。くろい ペンで、おおきく かいてね。"); return; }
    customs.unshift(c);
    while (customs.length > MAX_CUSTOM) customs.pop();
    saveCustoms();
    sel.trace = sel.color = "c" + c.id;
    render();
  }

  /* えらびかた・かくパッド */
  var padMode = false;
  function showChooser(msg) {
    cheer.hidden = true;
    $("#chMsg").textContent = msg || "かみに かいた えを しゃしんに とるか、ここで かきます。くろい ペンの えが おすすめ。";
    chooser.hidden = false;
  }
  $("#chCancel").addEventListener("click", function () { chooser.hidden = true; });
  $("#fileIn").addEventListener("change", function () {
    var f = this.files && this.files[0], input = this;
    if (!f) return;
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function () {
      var c = makeCustom(im, im.naturalWidth, im.naturalHeight, null, false);
      URL.revokeObjectURL(url); input.value = "";
      chooser.hidden = true;
      addCustom(c);
    };
    im.onerror = function () { URL.revokeObjectURL(url); input.value = ""; showChooser("しゃしんを ひらけませんでした。"); };
    im.src = url;
  });
  $("#drawBtn").addEventListener("click", openPad);

  function openPad() {
    chooser.hidden = true; cheer.hidden = true;
    padMode = true; traceState = null;
    host.innerHTML = canvasHTML(["padcv"]);
    paletteEl.hidden = true; padbar.hidden = false; adult.hidden = true; tools.hidden = true; hist.hidden = true; $("#nav").hidden = true;
    var cv = $("#padcv"), g = cv.getContext("2d", { willReadFrequently: true }), last = null;
    g.fillStyle = "#fff"; g.fillRect(0, 0, SZ, SZ);
    g.strokeStyle = "#000"; g.fillStyle = "#000"; g.lineWidth = 10; g.lineCap = "round"; g.lineJoin = "round";
    cv.addEventListener("pointerdown", function (e) {
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      last = cpos(cv, e);
      g.beginPath(); g.arc(last[0], last[1], 5, 0, 6.2832); g.fill();
    });
    cv.addEventListener("pointermove", function (e) {
      if (!last) return;
      var p = cpos(cv, e);
      g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke();
      last = p;
    });
    function up() { last = null; }
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    $("#padClear").onclick = function () { g.fillStyle = "#fff"; g.fillRect(0, 0, SZ, SZ); g.fillStyle = "#000"; };
    $("#padBack").onclick = function () { render(); };
    $("#padDone").onclick = function () {
      var c = makeCustom(cv, SZ, SZ, null, true);
      if (!c) { render(); showChooser("せんが みえません。もういちど かいてね。"); return; }
      addCustom(c);
    };
  }

  /* ---------- 全体 ---------- */
  function showCheer() {
    cheer.querySelectorAll("i").forEach(function (n) { n.remove(); });
    var cols = PALETTE.map(function (c) { return c[1]; });
    for (var i = 0; i < 18; i++) {
      var c = document.createElement("i");
      c.style.left = (Math.random() * 96) + "%";
      c.style.background = cols[i % (cols.length - 1)];
      c.style.setProperty("--d", (Math.random() * 0.6).toFixed(2) + "s");
      cheer.appendChild(c);
    }
    cheer.hidden = false;
  }

  function render() {
    cheer.hidden = true; chooser.hidden = true; viewer.hidden = true; padMode = false;
    paletteEl.hidden = false; padbar.hidden = true; tools.hidden = mode !== "color"; $("#nav").hidden = false;
    $("#tabTrace").setAttribute("aria-pressed", String(mode === "trace"));
    $("#tabColor").setAttribute("aria-pressed", String(mode === "color"));
    var it = currentItem();
    traceState = null;
    renderPicker(true);
    renderHist();
    if (it.kind === "shape") renderTrace(it);
    else if (it.kind === "pic") renderColor(it.p);
    else if (it.kind === "custom") { if (mode === "trace") renderCustomTrace(it.c); else renderCustomColor(it.c); }
    adult.hidden = it.kind !== "custom";
    disarm(); disarmDel();
  }

  var clearBtn = document.createElement("button");
  var armed = false, armT = 0;
  clearBtn.className = "clear";
  function disarm() {
    armed = false; clearTimeout(armT);
    clearBtn.removeAttribute("data-armed");
    clearBtn.innerHTML = "けす";
    clearBtn.setAttribute("aria-label", mode === "trace" ? "なぞった線をけす" : "ぬった色をぜんぶけす");
  }
  clearBtn.addEventListener("click", function () {
    if (mode === "trace") { if (traceState) traceState.reset(); return; }
    var it = currentItem();
    var any = it.kind === "pic" ? (Object.keys(fills[it.p.id]).length > 0 || brushes[it.p.id].length > 0) : (it.kind === "custom" && it.c.dirty);
    if (any && !armed) {
      armed = true;
      clearBtn.setAttribute("data-armed", "true");
      clearBtn.innerHTML = "もう<br>1かい";
      armT = setTimeout(disarm, 2500);
      return;
    }
    if (it.kind === "pic") { fills[it.p.id] = {}; brushes[it.p.id] = []; }
    else if (it.kind === "custom") { it.c.color.fill(0xFFFFFF); it.c.dirty = false; }
    render();
  });

  var delBtn = $("#delBtn"), delArmed = false, delT = 0;
  function disarmDel() {
    delArmed = false; clearTimeout(delT);
    delBtn.removeAttribute("data-armed");
    delBtn.textContent = "この えを けす(おとなの かた)";
  }
  delBtn.addEventListener("click", function () {
    var it = currentItem();
    if (it.kind !== "custom") return;
    if (!delArmed) {
      delArmed = true;
      delBtn.setAttribute("data-armed", "true");
      delBtn.textContent = "ほんとうに けす? もう1かい おす";
      delT = setTimeout(disarmDel, 3000);
      return;
    }
    customs = customs.filter(function (c) { return c !== it.c; });
    saveCustoms();
    delete history["c" + it.c.id]; saveHistory();
    sel.trace = "s0"; sel.color = "p0";
    render();
  });

  function buildPalette() {
    PALETTE.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "sw";
      b.style.setProperty("--c", c[1]);
      b.setAttribute("aria-label", c[0]);
      b.setAttribute("aria-pressed", String(c[1] === color));
      b.addEventListener("click", function () {
        color = c[1];
        paletteEl.querySelectorAll(".sw").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      });
      paletteEl.appendChild(b);
    });
    paletteEl.appendChild(clearBtn);
  }

  $("#tabTrace").addEventListener("click", function () { mode = "trace"; render(); });
  $("#tabColor").addEventListener("click", function () { mode = "color"; render(); });
  /* ---------- つぎへ(じゅんばん / ランダム) ---------- */
  var ORDER_KEY = "nazori-nurie.order.v1", order = "seq", bag = { trace: [], color: [] };
  try { if (localStorage.getItem(ORDER_KEY) === "rand") order = "rand"; } catch (err) { /* そのまま */ }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function nextKey() {
    var list = itemsFor(mode).filter(function (i) { return i.kind !== "add"; });
    var keys = list.map(function (i) { return i.key; }), cur = currentItem().key, k = keys.indexOf(cur);
    if (keys.length < 2) return cur;
    if (order === "seq") return keys[(k + 1) % keys.length];
    /* ランダム: ぜんぶ ひとまわりするまで おなじ えは でない */
    var b = bag[mode].filter(function (x) { return keys.indexOf(x) >= 0 && x !== cur; });
    if (!b.length) b = shuffle(keys.filter(function (x) { return x !== cur; }));
    var nx = b.shift();
    bag[mode] = b;
    return nx;
  }
  function goNext() { sel[mode] = nextKey(); render(); }
  function syncOrder() {
    var rnd = order === "rand", btn = $("#orderBtn");
    btn.setAttribute("aria-pressed", String(rnd));
    btn.setAttribute("aria-label", "えらびかた: " + (rnd ? "ランダム" : "じゅんばん") + "(おすと かわります)");
    $("#orderTxt").textContent = rnd ? "ランダム" : "じゅんばん";
    $("#orderIcon").innerHTML = rnd
      ? '<path d="M4 9h5c8 0 8 14 16 14h3M4 23h5c3 0 5-2 7-5M18 12c2-2 4-3 7-3h3M24 5l4 4-4 4M24 19l4 4-4 4"/>'
      : '<path d="M5 9h22M5 16h22M5 23h22"/>';
  }
  $("#orderBtn").addEventListener("click", function () {
    order = order === "rand" ? "seq" : "rand";
    bag = { trace: [], color: [] };
    try { localStorage.setItem(ORDER_KEY, order); } catch (err) { /* ほぞんできなくても OK */ }
    syncOrder();
  });
  $("#skipBtn").addEventListener("click", goNext);
  $("#nextBtn").addEventListener("click", goNext);
  $("#againBtn").addEventListener("click", function () { if (traceState) traceState.reset(); });

  tools.querySelectorAll(".tool").forEach(function (b) {
    b.addEventListener("click", function () {
      tool = b.getAttribute("data-tool");
      tools.querySelectorAll(".tool").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    });
  });

  syncOrder();
  loadHistory();
  buildPalette();
  render();
  loadCustoms();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
